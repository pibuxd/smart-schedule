name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: grafikomat
          POSTGRES_USER: grafikomat
          POSTGRES_PASSWORD: grafikomat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grafikomat" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is up to date
        run: |
          uv run python manage.py export_openapi_schema --api config.api.api --indent 2 --output ../frontend/openapi.json
          git diff --exit-code ../frontend/openapi.json
      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API client is up to date
        run: |
          npm run api:generate
          git diff --exit-code src/api/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - name: Generated API client is up to date
        run: |
          dart run swagger_parser
          git diff --exit-code lib/api/generated
          test -z "$(git status --porcelain lib/api/generated)"
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
