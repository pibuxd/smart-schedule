[project]
name = "grafikomat-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "django-ninja>=1.8.0",
    "gunicorn>=27.0.0",
    "phonenumbers>=9.0.43",
    "procrastinate[django]>=3.11.0",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"config/settings.py" = ["S105"]
# Django `Meta`/admin class attributes are plain lists by convention.
"apps/**/models.py" = ["RUF012"]
"apps/**/admin.py" = ["RUF012"]
# Demo data uses a seeded PRNG on purpose (deterministic, not security-related).
"apps/core/demo_data.py" = ["S311"]
